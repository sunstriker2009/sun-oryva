name: Install branding ZIP on this branch
on:
  push:
    branches-ignore: [main]
    paths:
      - 'branding/revisions/*.zip'
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency:
  group: branding-install-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    if: ${{ github.repository == 'sunstriker2009/sun-outpost' && github.actor == 'sunstriker2009' && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      # Pinned to the reviewed FOUNDRY action; no source scripts from the ZIP execute.
      - uses: sunstriker2009/sun-foundry/actions/install-branding-zip@3649197bc30bd95fbc54c4c5cb8e57cfc65a9b40
        with:
          validation-workflows: ci.yml,master-concurrency-tests.yml
