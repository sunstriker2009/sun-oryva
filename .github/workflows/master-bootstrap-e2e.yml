name: M1 full-stack master bootstrap E2E
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  master-bootstrap-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: oryva_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oryva_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ORYVA_TEST_DATABASE_URL: Host=127.0.0.1;Port=5432;Database=oryva_e2e;Username=postgres;Password=ci_only
      ORYVA_TEST_KEYCLOAK_ADMIN: ci-admin
      ORYVA_TEST_KEYCLOAK_PASSWORD: ci-only-not-production
      ORYVA_TEST_CLIENT_SECRET: ci-e2e-secret-only-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Initialize PostgreSQL schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/001_master_bootstrap.sql
      - name: Start isolated SMTP sink
        run: |
          docker network create oryva-e2e-net
          docker run -d --name oryva-e2e-mailpit --network oryva-e2e-net \
            -p 127.0.0.1:8025:8025 -p 127.0.0.1:1025:1025 axllent/mailpit:v1.27.2
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8025/api/v1/messages", timeout=3) as r:
                      if r.status == 200:
                          break
              except OSError:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("Isolated SMTP sink did not become ready")
          PY
      - name: Start Keycloak
        run: |
          docker run -d --name oryva-e2e-keycloak --network oryva-e2e-net -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci-only-not-production \
            -v "$PWD/infrastructure/keycloak/oryva-realm.json:/opt/keycloak/data/import/oryva-realm.json:ro" \
            quay.io/keycloak/keycloak:26.3.5 start-dev --import-realm
      - name: Wait for Keycloak readiness
        run: |
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:8080/realms/oryva/.well-known/openid-configuration"
          for _ in range(90):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      if response.status == 200:
                          break
              except OSError:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Keycloak did not become ready")
          PY
      - name: Validate effective Keycloak ownership profile and disabled marker persistence
        run: python tests/integration/keycloak_user_profile_e2e.py
      - name: Verify disabled-account enrollment remains fail-closed
        run: python tests/integration/keycloak_disabled_enrollment_e2e.py
      - name: Probe disabled-account action links using isolated SMTP sink
        run: python tests/integration/keycloak_disabled_action_link_e2e.py
      - name: Configure restricted test service account
        run: python tests/integration/setup_keycloak_e2e.py
      - name: Initialize admin provisioning schema before authorization E2E
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/002_admin_provisioning.sql
      - name: Initialize append-only admin audit schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/003_admin_provisioning_audit.sql
      - name: Initialize admin role assignment schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/004_admin_role_assignment.sql
      - name: Initialize admin activation schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/005_admin_activation.sql
      - name: Initialize admin deactivation schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/006_admin_deactivation.sql
      - name: Initialize viewer authorization schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/007_viewer_authorization.sql
      - name: Initialize viewer role assignment and audit schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/008_viewer_role_assignment.sql
      - name: Initialize guarded viewer activation schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/009_viewer_activation.sql
      - name: Initialize database-first viewer deactivation schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/010_viewer_deactivation.sql
      - name: Initialize atomic viewer reservation audit schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/011_viewer_reservation_audit.sql
      - name: Initialize atomic viewer preparation audit schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/012_viewer_preparation_audit.sql
      - name: Initialize cross-replica management quota schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/013_management_write_quotas.sql
      - name: Initialize one-time viewer invitation challenge schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/014_viewer_invitation_challenges.sql
      - name: Initialize append-only invitation event audit schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/015_viewer_invitation_audit.sql
      - name: Initialize invitation subject snapshot migration
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/016_viewer_invitation_subject_binding.sql
      - name: Initialize encrypted invitation outbox schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/017_viewer_invitation_encrypted_outbox.sql
      - name: Initialize fenced invitation outbox claims
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/018_viewer_invitation_outbox_leases.sql
      - name: Initialize transactional invitation SMTP handoff schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/019_viewer_invitation_smtp_handoff.sql
      - name: Initialize internal browser exchange schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/020_viewer_invitation_browser_exchange.sql
      - name: Initialize cross-replica browser exchange quota schema
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/021_viewer_invitation_exchange_quotas.sql
      - name: Initialize cross-replica browser admission quotas
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/022_browser_admission_quotas.sql
      - name: Initialize append-only browser session lifecycle audit
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_only -v "$PWD:/work:ro" postgres:17-alpine psql -h 127.0.0.1 -U postgres -d oryva_e2e -v ON_ERROR_STOP=1 -f /work/infrastructure/postgres/023_browser_session_lifecycle_audit.sql
      - name: Run isolated browser admission PostgreSQL and HTTP E2E
        run: dotnet run --project tests/integration/Sun.Security.BrowserAdmission.E2E/Sun.Security.BrowserAdmission.E2E.csproj -c Release
      - name: Run isolated invitation-to-browser exchange PostgreSQL security E2E
        run: dotnet run --project tests/integration/Sun.Security.InvitationExchange.E2E/Sun.Security.InvitationExchange.E2E.csproj -c Release
      - name: Run guarded browser session PostgreSQL and HTTP E2E
        run: dotnet run --project tests/integration/Sun.Security.GuardedSession.E2E/Sun.Security.GuardedSession.E2E.csproj -c Release
      - name: Run one-time viewer invitation PostgreSQL security E2E
        run: dotnet run --project tests/integration/Sun.Security.ViewerInvitation.E2E/Sun.Security.ViewerInvitation.E2E.csproj -c Release
      - name: Run actual .NET bootstrap against Keycloak and PostgreSQL
        run: dotnet run --project tests/integration/Sun.Security.Bootstrap.E2E/Sun.Security.Bootstrap.E2E.csproj -c Release
      - name: Run viewer authorization PostgreSQL and HTTP E2E
        run: dotnet run --project tests/integration/Sun.Security.ViewerAuthorization.E2E/Sun.Security.ViewerAuthorization.E2E.csproj -c Release
      - name: Run admin provisioning PostgreSQL and Keycloak E2E
        run: dotnet run --project tests/integration/Sun.Security.AdminProvisioning.E2E/Sun.Security.AdminProvisioning.E2E.csproj -c Release
      - name: Keycloak logs on failure
        if: failure()
        run: |
          docker logs oryva-e2e-keycloak --tail 120
          docker logs oryva-e2e-mailpit --tail 60
