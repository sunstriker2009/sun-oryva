name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build backend projects
        run: |
          dotnet build src/backend/Sun.Security.Abstractions/Sun.Security.Abstractions.csproj -c Release
          dotnet build src/backend/Sun.Security.AspNetCore/Sun.Security.AspNetCore.csproj -c Release
          dotnet build src/backend/Sun.Security.Api/Sun.Security.Api.csproj -c Release
          dotnet build tests/unit/Sun.Security.UnitTests/Sun.Security.UnitTests.csproj -c Release
          dotnet build src/backend/Sun.Security.Bootstrap/Sun.Security.Bootstrap.csproj -c Release
          dotnet run --project tests/unit/Sun.Security.Bootstrap.PolicyTests/Sun.Security.Bootstrap.PolicyTests.csproj -c Release
          dotnet run --project tests/unit/Sun.Security.SmtpTransport.PolicyTests/Sun.Security.SmtpTransport.PolicyTests.csproj -c Release
          dotnet run --project tests/unit/Sun.Security.InvitationHealth.PolicyTests/Sun.Security.InvitationHealth.PolicyTests.csproj -c Release
          dotnet run --project tests/unit/Sun.Security.BrowserBoundary.PolicyTests/Sun.Security.BrowserBoundary.PolicyTests.csproj -c Release
          dotnet run --project tests/unit/Sun.Security.GuardedSession.PolicyTests/Sun.Security.GuardedSession.PolicyTests.csproj -c Release
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oryva_test
          POSTGRES_PASSWORD: oryva_test
          POSTGRES_DB: oryva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oryva_test -d oryva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORYVA_OIDC_TEST_DATABASE_URL: postgres://oryva_test:oryva_test@localhost:5432/oryva_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @sun-security/core test
      - run: pnpm --filter @sun-security/console test
