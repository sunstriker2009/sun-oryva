             SET email = 'browser-change@example.invalid'
           WHERE id = '00000000-0000-0000-0000-000000000003';
          UPDATE oryva.viewer_accounts
             SET email = 'audit@example.invalid'
           WHERE id = '00000000-0000-0000-0000-000000000003';
