name: Bootstrap schema validation
on:
  pull_request:
    paths:
      - "infrastructure/postgres/**"
      - ".github/workflows/bootstrap-schema-validation.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/postgres/**"
      - ".github/workflows/bootstrap-schema-validation.yml"
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_only
          POSTGRES_USER: postgres
          POSTGRES_DB: oryva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oryva_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema twice (idempotence)
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/001_master_bootstrap.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/001_master_bootstrap.sql
      - name: Validate viewer schema idempotence and fail-closed constraints
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/007_viewer_authorization.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/007_viewer_authorization.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO oryva.viewer_accounts
              (id, username, email, requested_by_subject, requested_by_role)
          VALUES ('00000000-0000-0000-0000-000000000001', 'viewer-one',
                  'one@example.invalid', 'test-master', 'master');
          DO $viewer_guard$
          BEGIN
            BEGIN
              INSERT INTO oryva.viewer_accounts
                  (id, username, email, requested_by_subject, requested_by_role)
              VALUES ('00000000-0000-0000-0000-000000000002', 'viewer-two',
                      'ONE@example.invalid', 'test-admin', 'admin');
              RAISE EXCEPTION 'case-insensitive email uniqueness was not enforced';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN
              UPDATE oryva.viewer_accounts SET state = 'active'
              WHERE username = 'viewer-one';
              RAISE EXCEPTION 'active viewer without subject was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              UPDATE oryva.viewer_accounts SET requested_by_role = 'viewer'
              WHERE username = 'viewer-one';
              RAISE EXCEPTION 'viewer actor role was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $viewer_guard$;
          SQL
      - name: Validate viewer activation schema, audit and idempotence
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/008_viewer_role_assignment.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/008_viewer_role_assignment.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/009_viewer_activation.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/009_viewer_activation.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/010_viewer_deactivation.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/010_viewer_deactivation.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE oryva.viewer_accounts
             SET keycloak_subject_id = 'ci-viewer-subject', state = 'role_assigned'
           WHERE username = 'viewer-one';
          INSERT INTO oryva.viewer_provisioning_audit
              (provisioning_id, event_type, actor_subject, actor_role)
          VALUES ('00000000-0000-0000-0000-000000000001',
                  'activation_pending', 'ci-master', 'master');
          DO $viewer_activation$
          BEGIN
            BEGIN
              UPDATE oryva.viewer_accounts
                 SET state = 'activation_pending', keycloak_subject_id = NULL
               WHERE username = 'viewer-one';
              RAISE EXCEPTION 'activation intent without bound subject accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO oryva.viewer_provisioning_audit
                  (provisioning_id, event_type, actor_subject, actor_role)
              VALUES ('00000000-0000-0000-0000-000000000001',
                      'password_changed', 'ci-master', 'master');
              RAISE EXCEPTION 'unknown viewer audit event accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            DECLARE
              mutation_blocked boolean := false;
            BEGIN
              BEGIN
                UPDATE oryva.viewer_provisioning_audit SET actor_role = 'admin';
              EXCEPTION WHEN raise_exception THEN
                mutation_blocked := true;
              END;
              IF NOT mutation_blocked THEN
                RAISE EXCEPTION 'viewer audit mutation accepted';
              END IF;
            END;
          END $viewer_activation$;
          DO $viewer_deactivation$
          BEGIN
            BEGIN
              UPDATE oryva.viewer_accounts
                 SET state = 'deactivation_pending', keycloak_subject_id = NULL
               WHERE username = 'viewer-one';
              RAISE EXCEPTION 'deactivation intent without subject accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            INSERT INTO oryva.viewer_provisioning_audit
                (provisioning_id, event_type, actor_subject, actor_role)
            VALUES ('00000000-0000-0000-0000-000000000001',
                    'deactivation_pending', 'ci-master', 'master');
          END $viewer_deactivation$;
          SQL
      - name: Validate atomic viewer reservation audit migration
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/011_viewer_reservation_audit.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/011_viewer_reservation_audit.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          WITH created AS (
            INSERT INTO oryva.viewer_accounts
              (id, username, email, requested_by_subject, requested_by_role)
            VALUES ('00000000-0000-0000-0000-000000000003', 'viewer-audited',
                    'audit@example.invalid', 'test-admin', 'admin')
            ON CONFLICT DO NOTHING RETURNING id
          ), audited AS (
            INSERT INTO oryva.viewer_provisioning_audit
              (provisioning_id, event_type, actor_subject, actor_role)
            SELECT id, 'reserved', 'test-admin', 'admin' FROM created
            RETURNING provisioning_id
          )
          SELECT provisioning_id FROM audited;
          DO $viewer_reservation_audit$
          BEGIN
            IF (SELECT count(*) FROM oryva.viewer_provisioning_audit
                WHERE provisioning_id = '00000000-0000-0000-0000-000000000003'
                  AND event_type = 'reserved' AND actor_subject = 'test-admin'
                  AND actor_role = 'admin') <> 1 THEN
              RAISE EXCEPTION 'viewer reservation audit was not recorded';
            END IF;
            BEGIN
              INSERT INTO oryva.viewer_provisioning_audit
                (provisioning_id, event_type, actor_subject, actor_role)
              VALUES ('00000000-0000-0000-0000-000000000003',
                      'unsafe_invitation_sent', 'test-admin', 'admin');
              RAISE EXCEPTION 'unknown viewer audit event accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              EXECUTE $rollback_sql$
                WITH created AS (
                  INSERT INTO oryva.viewer_accounts
                    (id, username, email, requested_by_subject, requested_by_role)
                  VALUES ('00000000-0000-0000-0000-000000000004',
                          'viewer-audit-rollback', 'rollback@example.invalid',
                          'test-master', 'master')
                  RETURNING id
                )
                INSERT INTO oryva.viewer_provisioning_audit
                  (provisioning_id, event_type, actor_subject, actor_role)
                SELECT id, 'reserved', 'test-master', 'viewer' FROM created
              $rollback_sql$;
              RAISE EXCEPTION 'invalid audit actor role was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            IF EXISTS (SELECT 1 FROM oryva.viewer_accounts
                       WHERE username = 'viewer-audit-rollback') THEN
              RAISE EXCEPTION 'viewer reservation survived failed audit insert';
            END IF;
          END $viewer_reservation_audit$;
          SQL
      - name: Verify singleton and state constraints
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO oryva.master_bootstrap (singleton_id, state) VALUES (1, 'pending');
          DO $$
          BEGIN
            BEGIN
              INSERT INTO oryva.master_bootstrap (singleton_id, state) VALUES (2, 'pending');
              RAISE EXCEPTION 'singleton check did not reject second row';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              UPDATE oryva.master_bootstrap SET state = 'active';
              RAISE EXCEPTION 'state check did not reject missing subject';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $$;
          UPDATE oryva.master_bootstrap
             SET state = 'active', subject_id = 'test-subject', activated_at = now()
           WHERE singleton_id = 1;
          DO $$
          BEGIN
            IF (SELECT count(*) FROM oryva.master_bootstrap
                WHERE state = 'active' AND subject_id = 'test-subject') <> 1 THEN
              RAISE EXCEPTION 'expected exactly one active master reservation';
            END IF;
          END $$;
          SQL
