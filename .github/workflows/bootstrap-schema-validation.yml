name: Bootstrap schema validation
on:
  pull_request:
    paths:
      - "infrastructure/postgres/**"
      - ".github/workflows/bootstrap-schema-validation.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/postgres/**"
      - ".github/workflows/bootstrap-schema-validation.yml"
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_only
          POSTGRES_USER: postgres
          POSTGRES_DB: oryva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oryva_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema twice (idempotence)
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/001_master_bootstrap.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/001_master_bootstrap.sql
      - name: Validate viewer schema idempotence and fail-closed constraints
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/007_viewer_authorization.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/007_viewer_authorization.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO oryva.viewer_accounts
              (id, username, email, requested_by_subject, requested_by_role)
          VALUES ('00000000-0000-0000-0000-000000000001', 'viewer-one',
                  'one@example.invalid', 'test-master', 'master');
          DO $viewer_guard$
          BEGIN
            BEGIN
              INSERT INTO oryva.viewer_accounts
                  (id, username, email, requested_by_subject, requested_by_role)
              VALUES ('00000000-0000-0000-0000-000000000002', 'viewer-two',
                      'ONE@example.invalid', 'test-admin', 'admin');
              RAISE EXCEPTION 'case-insensitive email uniqueness was not enforced';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN
              UPDATE oryva.viewer_accounts SET state = 'active'
              WHERE username = 'viewer-one';
              RAISE EXCEPTION 'active viewer without subject was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              UPDATE oryva.viewer_accounts SET requested_by_role = 'viewer'
              WHERE username = 'viewer-one';
              RAISE EXCEPTION 'viewer actor role was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $viewer_guard$;
          SQL
      - name: Validate viewer activation schema, audit and idempotence
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/008_viewer_role_assignment.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/008_viewer_role_assignment.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/009_viewer_activation.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/009_viewer_activation.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/010_viewer_deactivation.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/010_viewer_deactivation.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE oryva.viewer_accounts
             SET keycloak_subject_id = 'ci-viewer-subject', state = 'role_assigned'
           WHERE username = 'viewer-one';
          INSERT INTO oryva.viewer_provisioning_audit
              (provisioning_id, event_type, actor_subject, actor_role)
          VALUES ('00000000-0000-0000-0000-000000000001',
                  'activation_pending', 'ci-master', 'master');
          DO $viewer_activation$
          BEGIN
            BEGIN
              UPDATE oryva.viewer_accounts
                 SET state = 'activation_pending', keycloak_subject_id = NULL
               WHERE username = 'viewer-one';
              RAISE EXCEPTION 'activation intent without bound subject accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO oryva.viewer_provisioning_audit
                  (provisioning_id, event_type, actor_subject, actor_role)
              VALUES ('00000000-0000-0000-0000-000000000001',
                      'password_changed', 'ci-master', 'master');
              RAISE EXCEPTION 'unknown viewer audit event accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            DECLARE
              mutation_blocked boolean := false;
            BEGIN
              BEGIN
                UPDATE oryva.viewer_provisioning_audit SET actor_role = 'admin';
              EXCEPTION WHEN raise_exception THEN
                mutation_blocked := true;
              END;
              IF NOT mutation_blocked THEN
                RAISE EXCEPTION 'viewer audit mutation accepted';
              END IF;
            END;
          END $viewer_activation$;
          DO $viewer_deactivation$
          BEGIN
            BEGIN
              UPDATE oryva.viewer_accounts
                 SET state = 'deactivation_pending', keycloak_subject_id = NULL
               WHERE username = 'viewer-one';
              RAISE EXCEPTION 'deactivation intent without subject accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            INSERT INTO oryva.viewer_provisioning_audit
                (provisioning_id, event_type, actor_subject, actor_role)
            VALUES ('00000000-0000-0000-0000-000000000001',
                    'deactivation_pending', 'ci-master', 'master');
          END $viewer_deactivation$;
          SQL
      - name: Validate atomic viewer reservation audit migration
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/011_viewer_reservation_audit.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/011_viewer_reservation_audit.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          WITH created AS (
            INSERT INTO oryva.viewer_accounts
              (id, username, email, requested_by_subject, requested_by_role)
            VALUES ('00000000-0000-0000-0000-000000000003', 'viewer-audited',
                    'audit@example.invalid', 'test-admin', 'admin')
            ON CONFLICT DO NOTHING RETURNING id
          ), audited AS (
            INSERT INTO oryva.viewer_provisioning_audit
              (provisioning_id, event_type, actor_subject, actor_role)
            SELECT id, 'reserved', 'test-admin', 'admin' FROM created
            RETURNING provisioning_id
          )
          SELECT provisioning_id FROM audited;
          DO $viewer_reservation_audit$
          BEGIN
            IF (SELECT count(*) FROM oryva.viewer_provisioning_audit
                WHERE provisioning_id = '00000000-0000-0000-0000-000000000003'
                  AND event_type = 'reserved' AND actor_subject = 'test-admin'
                  AND actor_role = 'admin') <> 1 THEN
              RAISE EXCEPTION 'viewer reservation audit was not recorded';
            END IF;
            BEGIN
              INSERT INTO oryva.viewer_provisioning_audit
                (provisioning_id, event_type, actor_subject, actor_role)
              VALUES ('00000000-0000-0000-0000-000000000003',
                      'unsafe_invitation_sent', 'test-admin', 'admin');
              RAISE EXCEPTION 'unknown viewer audit event accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              EXECUTE $rollback_sql$
                WITH created AS (
                  INSERT INTO oryva.viewer_accounts
                    (id, username, email, requested_by_subject, requested_by_role)
                  VALUES ('00000000-0000-0000-0000-000000000004',
                          'viewer-audit-rollback', 'rollback@example.invalid',
                          'test-master', 'master')
                  RETURNING id
                )
                INSERT INTO oryva.viewer_provisioning_audit
                  (provisioning_id, event_type, actor_subject, actor_role)
                SELECT id, 'reserved', 'test-master', 'viewer' FROM created
              $rollback_sql$;
              RAISE EXCEPTION 'invalid audit actor role was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            IF EXISTS (SELECT 1 FROM oryva.viewer_accounts
                       WHERE username = 'viewer-audit-rollback') THEN
              RAISE EXCEPTION 'viewer reservation survived failed audit insert';
            END IF;
          END $viewer_reservation_audit$;
          SQL
      - name: Validate atomic viewer preparation audit and rollback
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/012_viewer_preparation_audit.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/012_viewer_preparation_audit.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $viewer_prepared_audit$
          BEGIN
            BEGIN
              EXECUTE $bad_actor$
                WITH changed AS (
                  UPDATE oryva.viewer_accounts
                     SET keycloak_subject_id = 'verified-ci-subject', state = 'prepared'
                   WHERE id = '00000000-0000-0000-0000-000000000003'
                     AND state = 'reserved'
                  RETURNING id
                )
                INSERT INTO oryva.viewer_provisioning_audit
                  (provisioning_id, event_type, actor_subject, actor_role)
                SELECT id, 'prepared', 'ci-actor', 'viewer' FROM changed
              $bad_actor$;
              RAISE EXCEPTION 'invalid preparation audit actor accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            IF (SELECT state FROM oryva.viewer_accounts
                WHERE id = '00000000-0000-0000-0000-000000000003') <> 'reserved' THEN
              RAISE EXCEPTION 'prepared state survived failed audit insertion';
            END IF;
          END $viewer_prepared_audit$;
          WITH changed AS (
            UPDATE oryva.viewer_accounts
               SET keycloak_subject_id = 'verified-ci-subject', state = 'prepared'
             WHERE id = '00000000-0000-0000-0000-000000000003' AND state = 'reserved'
             RETURNING id
          )
          INSERT INTO oryva.viewer_provisioning_audit
            (provisioning_id, event_type, actor_subject, actor_role)
          SELECT id, 'prepared', 'ci-admin', 'admin' FROM changed;
          DO $viewer_prepared_verified$
          BEGIN
            IF (SELECT count(*) FROM oryva.viewer_provisioning_audit
                WHERE provisioning_id = '00000000-0000-0000-0000-000000000003'
                  AND event_type = 'prepared' AND actor_subject = 'ci-admin'
                  AND actor_role = 'admin') <> 1 THEN
              RAISE EXCEPTION 'verified prepared transition not audited exactly once';
            END IF;
          END $viewer_prepared_verified$;
          SQL
      - name: Validate cross-replica quota schema and constraints
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/013_management_write_quotas.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/013_management_write_quotas.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $quota_guard$
          BEGIN
            BEGIN
              INSERT INTO oryva.management_write_quotas
                (subject_key, window_start, request_count)
              VALUES (repeat('A', 64), now(), 121);
              RAISE EXCEPTION 'quota overflow accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO oryva.management_write_quotas
                (subject_key, window_start, request_count)
              VALUES ('raw-subject', now(), 1);
              RAISE EXCEPTION 'raw subject accepted as quota key';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $quota_guard$;
          SQL
      - name: Validate one-time invitation challenge schema and constraints
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/014_viewer_invitation_challenges.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/014_viewer_invitation_challenges.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO oryva.viewer_invitation_challenges
              (id, viewer_id, token_digest, recipient_email, issued_by_subject,
               issued_by_role, expires_at)
          VALUES ('10000000-0000-0000-0000-000000000001',
                  '00000000-0000-0000-0000-000000000003',
                  repeat('A', 64), 'audit@example.invalid', 'ci-master',
                  'master', now() + interval '15 minutes');
          DO $invitation_schema$
          BEGIN
            BEGIN
              INSERT INTO oryva.viewer_invitation_challenges
                  (id, viewer_id, token_digest, recipient_email,
                   issued_by_subject, issued_by_role, expires_at)
              VALUES ('10000000-0000-0000-0000-000000000002',
                      '00000000-0000-0000-0000-000000000003',
                      repeat('B', 64), 'audit@example.invalid',
                      'ci-admin', 'admin', now() + interval '15 minutes');
              RAISE EXCEPTION 'multiple outstanding challenges accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO oryva.viewer_invitation_challenges
                  (id, viewer_id, token_digest, recipient_email,
                   issued_by_subject, issued_by_role, expires_at)
              VALUES ('10000000-0000-0000-0000-000000000003',
                      '00000000-0000-0000-0000-000000000003',
                      'plaintext-token', 'audit@example.invalid',
                      'ci-admin', 'admin', now() + interval '15 minutes');
              RAISE EXCEPTION 'plaintext or malformed digest accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO oryva.viewer_invitation_challenges
                  (id, viewer_id, token_digest, recipient_email,
                   issued_by_subject, issued_by_role, expires_at)
              VALUES ('10000000-0000-0000-0000-000000000004',
                      '00000000-0000-0000-0000-000000000003',
                      repeat('C', 64), 'audit@example.invalid',
                      'ci-viewer', 'viewer', now() + interval '15 minutes');
              RAISE EXCEPTION 'viewer issuer accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO oryva.viewer_invitation_challenges
                  (id, viewer_id, token_digest, recipient_email,
                   issued_by_subject, issued_by_role, expires_at)
              VALUES ('10000000-0000-0000-0000-000000000005',
                      '00000000-0000-0000-0000-000000000003',
                      repeat('D', 64), 'audit@example.invalid',
                      'ci-admin', 'admin', now() + interval '16 minutes');
              RAISE EXCEPTION 'overlong challenge expiry accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $invitation_schema$;
          UPDATE oryva.viewer_invitation_challenges
             SET revoked_at = now()
           WHERE id = '10000000-0000-0000-0000-000000000001';
          INSERT INTO oryva.viewer_invitation_challenges
              (id, viewer_id, token_digest, recipient_email,
               issued_by_subject, issued_by_role, expires_at)
          VALUES ('10000000-0000-0000-0000-000000000006',
                  '00000000-0000-0000-0000-000000000003',
                  repeat('E', 64), 'audit@example.invalid',
                  'ci-admin', 'admin', now() + interval '15 minutes');
          SQL
      - name: Validate append-only invitation event audit schema
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/015_viewer_invitation_audit.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/015_viewer_invitation_audit.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO oryva.viewer_invitation_audit
              (challenge_id, viewer_id, event_type, actor_subject, actor_role)
          VALUES ('10000000-0000-0000-0000-000000000001',
                  '00000000-0000-0000-0000-000000000003',
                  'issued', 'ci-master', 'master');
          DO $invitation_audit$
          BEGIN
            BEGIN
              INSERT INTO oryva.viewer_invitation_audit
                  (challenge_id, viewer_id, event_type, actor_subject, actor_role)
              VALUES ('10000000-0000-0000-0000-000000000002',
                      '00000000-0000-0000-0000-000000000003',
                      'issued', 'ci-viewer', 'viewer');
              RAISE EXCEPTION 'viewer audit actor accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO oryva.viewer_invitation_audit
                  (challenge_id, viewer_id, event_type, actor_subject, actor_role)
              VALUES ('10000000-0000-0000-0000-000000000004',
                      '00000000-0000-0000-0000-000000000003',
                      'issued', 'ci-master', NULL);
              RAISE EXCEPTION 'missing management audit role accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO oryva.viewer_invitation_audit
                  (challenge_id, viewer_id, event_type, actor_subject, actor_role)
              VALUES ('10000000-0000-0000-0000-000000000003',
                      '00000000-0000-0000-0000-000000000003',
                      'consumed', 'fake-recipient', 'viewer');
              RAISE EXCEPTION 'unauthenticated consumption actor accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO oryva.viewer_invitation_audit
                  (challenge_id, viewer_id, event_type, actor_subject, actor_role)
              VALUES ('10000000-0000-0000-0000-000000000001',
                      '00000000-0000-0000-0000-000000000003',
                      'issued', 'ci-master', 'master');
              RAISE EXCEPTION 'duplicate event accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN
              UPDATE oryva.viewer_invitation_audit
                 SET actor_subject = 'tampered'
               WHERE challenge_id = '10000000-0000-0000-0000-000000000001';
              RAISE EXCEPTION 'audit mutation accepted' USING ERRCODE = '22000';
            EXCEPTION WHEN raise_exception THEN NULL;
            END;
            BEGIN
              DELETE FROM oryva.viewer_invitation_audit
               WHERE challenge_id = '10000000-0000-0000-0000-000000000001';
              RAISE EXCEPTION 'audit deletion accepted' USING ERRCODE = '22000';
            EXCEPTION WHEN raise_exception THEN NULL;
            END;
          END $invitation_audit$;
          SQL
      - name: Validate invitation subject snapshot migration and idempotence
        run: |
          # Fixture-only: terminate legacy challenges before migration.
          # Production must use an actor-attributed, audited revocation.
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -c "UPDATE oryva.viewer_invitation_challenges SET revoked_at = now() WHERE consumed_at IS NULL AND revoked_at IS NULL"
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/016_viewer_invitation_subject_binding.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/016_viewer_invitation_subject_binding.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $subject_snapshot$
          BEGIN
            IF (SELECT keycloak_subject_snapshot
                FROM oryva.viewer_invitation_challenges
                WHERE id = '10000000-0000-0000-0000-000000000001') <> 'verified-ci-subject' THEN
              RAISE EXCEPTION 'legacy invitation was not backfilled with exact subject';
            END IF;
            BEGIN
              UPDATE oryva.viewer_invitation_challenges
                 SET keycloak_subject_snapshot = ''
               WHERE id = '10000000-0000-0000-0000-000000000001';
              RAISE EXCEPTION 'empty subject snapshot accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $subject_snapshot$;
          SQL
      - name: Validate encrypted invitation outbox schema and idempotence
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/017_viewer_invitation_encrypted_outbox.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/017_viewer_invitation_encrypted_outbox.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO oryva.viewer_invitation_outbox
              (challenge_id, key_id, nonce, ciphertext, auth_tag)
          VALUES ('10000000-0000-0000-0000-000000000001', 'ci-v1',
                  decode(repeat('AA', 12), 'hex'),
                  decode(repeat('BB', 43), 'hex'),
                  decode(repeat('CC', 16), 'hex'));
          DO $encrypted_outbox$
          BEGIN
            BEGIN
              INSERT INTO oryva.viewer_invitation_outbox
                  (challenge_id, key_id, nonce, ciphertext, auth_tag)
              VALUES ('10000000-0000-0000-0000-000000000006', 'bad key',
                      decode(repeat('AA', 12), 'hex'),
                      decode(repeat('BB', 43), 'hex'),
                      decode(repeat('CC', 16), 'hex'));
              RAISE EXCEPTION 'unsafe key identifier accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO oryva.viewer_invitation_outbox
                  (challenge_id, key_id, nonce, ciphertext, auth_tag)
              VALUES ('10000000-0000-0000-0000-000000000006', 'ci-v1',
                      decode(repeat('AA', 11), 'hex'),
                      decode(repeat('BB', 43), 'hex'),
                      decode(repeat('CC', 16), 'hex'));
              RAISE EXCEPTION 'short AES-GCM nonce accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              UPDATE oryva.viewer_invitation_outbox SET state = 'cancelled'
              WHERE challenge_id = '10000000-0000-0000-0000-000000000001';
              RAISE EXCEPTION 'cancellation without timestamp accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $encrypted_outbox$;
          SQL
      - name: Validate fenced invitation lease schema and idempotence
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/018_viewer_invitation_outbox_leases.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/018_viewer_invitation_outbox_leases.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $lease_schema$
          BEGIN
            BEGIN
              UPDATE oryva.viewer_invitation_outbox
              SET state = 'leased' WHERE challenge_id = '10000000-0000-0000-0000-000000000001';
              RAISE EXCEPTION 'leased row without fencing fields accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              UPDATE oryva.viewer_invitation_outbox
              SET attempt_count = 6 WHERE challenge_id = '10000000-0000-0000-0000-000000000001';
              RAISE EXCEPTION 'excessive retry attempts accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $lease_schema$;
          SQL
      - name: Validate SMTP acceptance state and append-only audit migration
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/019_viewer_invitation_smtp_handoff.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/019_viewer_invitation_smtp_handoff.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $smtp_schema$
          BEGIN
            BEGIN
              UPDATE oryva.viewer_invitation_outbox
              SET state = 'sent'
              WHERE challenge_id = '10000000-0000-0000-0000-000000000001';
              RAISE EXCEPTION 'SMTP sent without acceptance timestamp accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $smtp_schema$;
          INSERT INTO oryva.viewer_invitation_delivery_audit
            (id, challenge_id, event_type, attempt_count)
          VALUES ('20000000-0000-0000-0000-000000000001',
                  '10000000-0000-0000-0000-000000000001', 'smtp_accepted', 1);
          DO $smtp_audit$
          BEGIN
            BEGIN
              UPDATE oryva.viewer_invitation_delivery_audit
              SET attempt_count = 2;
              RAISE EXCEPTION 'Mutable delivery audit accepted';
            EXCEPTION WHEN raise_exception THEN
              IF SQLERRM <> 'Invitation delivery audit is append-only' THEN RAISE; END IF;
            END;
          END $smtp_audit$;
          SQL
      - name: Validate browser exchange schema, revocation trigger and idempotence
        run: |
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/020_viewer_invitation_browser_exchange.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 -f infrastructure/postgres/020_viewer_invitation_browser_exchange.sql
          psql -h localhost -U postgres -d oryva_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO oryva.viewer_invitation_browser_sessions
            (id, challenge_id, viewer_id, session_digest,
             subject_snapshot, created_at, expires_at)
          VALUES ('30000000-0000-0000-0000-000000000001',
                  '10000000-0000-0000-0000-000000000001',
                  '00000000-0000-0000-0000-000000000003',
                  repeat('F', 64), 'verified-ci-subject',
                  now(), now() + interval '4 minutes');
          DO $browser_exchange_schema$
          BEGIN
            BEGIN
              INSERT INTO oryva.viewer_invitation_browser_sessions
                (id, challenge_id, viewer_id, session_digest,
                 subject_snapshot, created_at, expires_at)
              VALUES ('30000000-0000-0000-0000-000000000002',
                      '10000000-0000-0000-0000-000000000006',
                      '00000000-0000-0000-0000-000000000003',
